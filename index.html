<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ileprad.pl - Kalkulator kosztów zużycia prądu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator-box {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .results {
            margin-top: 20px;
            padding: 15px;
            background: #eaf2f8;
            border-radius: 5px;
            font-size: 15px;
        }
        .results p {
            margin: 8px 0;
        }
    </style>
</head>
<body>

<div class="calculator-box">
    <h1>Ile prądu zużywa urządzenie?</h1>
    
    <div class="form-group">
        <label for="power">Moc urządzenia (w Watach - W):</label>
        <input type="number" id="power" placeholder="np. 2000 (czajnik, grzejnik)" value="1000">
    </div>

    <div class="form-group">
        <label for="hours">Czas pracy dziennie (w godzinach):</label>
        <input type="number" id="hours" step="0.1" placeholder="np. 2" value="1">
    </div>

    <div class="form-group">
        <label for="price">Cena za 1 kWh (w PLN):</label>
        <input type="number" id="price" step="0.01" placeholder="np. 1.15" value="1.15">
    </div>

    <button onclick="calculateEnergy()">Oblicz koszt</button>

    <div class="results" id="results">
        <p><strong>Zużycie dzienne:</strong> <span id="resKwhDay">0</span> kWh</p>
        <p><strong>Koszt dzienny:</strong> <span id="resCostDay">0</span> PLN</p>
        <p><strong>Koszt miesięczny (30 dni):</strong> <span id="resCostMonth">0</span> PLN</p>
    </div>
</div>

<script>
function calculateEnergy() {
    const power = parseFloat(document.getElementById('power').value) || 0;
    const hours = parseFloat(document.getElementById('hours').value) || 0;
    const price = parseFloat(document.getElementById('price').value) || 0;

    // Obliczenia: (Moc w W / 1000) * godziny = kWh dziennie
    const kwhDay = (power / 1000) * hours;
    const costDay = kwhDay * price;
    const costMonth = costDay * 30;

    document.getElementById('resKwhDay').innerText = kwhDay.toFixed(2);
    document.getElementById('resCostDay').innerText = costDay.toFixed(2);
    document.getElementById('resCostMonth').innerText = costMonth.toFixed(2);
}

// Wywołaj raz na start, żeby pokazać domyślne wyniki
calculateEnergy();
</script>

</body>
</html>
